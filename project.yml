name: iDipper
options:
  xcodeVersion: "27.0"
  bundleIdPrefix: com.xlitec
  developmentLanguage: en
  deploymentTarget: { macOS: "14.0" }
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iDipper:
    type: application
    platform: macOS
    sources:
      - path: Sources
        includes: ["*.swift"]
      - path: Resources
      - path: Assets.xcassets
      - path: Vendor/7zz
        buildPhase:
          copyFiles:
            destination: executables
      - path: Vendor/unrar
        buildPhase:
          copyFiles:
            destination: executables
    settings:
      base:
        PRODUCT_NAME: iDipper
        PRODUCT_BUNDLE_IDENTIFIER: com.xlitec.dipper
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: iDipper.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: KFM4CKVPL5
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ARCHS: arm64
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
    preBuildScripts:
      - name: Bump build number
        script: "\"$SRCROOT/tools/bump.sh\""
        basedOnDependencyAnalysis: false
      - name: Generate localizations (l10n/gen.py)
        script: |
          cd "$SRCROOT" && /usr/bin/python3 -c "exec(open('l10n/gen.py').read())"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Sign bundled helpers (sandbox inherit)
        script: |
          ID="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          sign_helper() {
            name="$1"
            bin="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/$name"
            if [ ! -f "$bin" ]; then return 0; fi
            if [ -n "$DWARF_DSYM_FOLDER_PATH" ]; then /usr/bin/xcrun dsymutil "$bin" -o "$DWARF_DSYM_FOLDER_PATH/$name.dSYM" 2>/dev/null || true; fi
            /usr/bin/codesign --force --sign "$ID" -o runtime --timestamp --entitlements "$SRCROOT/tools/7zz.entitlements" "$bin"
          }
          sign_helper 7zz
          sign_helper unrar
        basedOnDependencyAnalysis: false
schemes:
  iDipper:
    build: { targets: { iDipper: all } }
    run: { config: Debug }
    archive: { config: Release }
